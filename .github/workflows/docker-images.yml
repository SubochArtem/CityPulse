name: Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: users
            context: .
            dockerfile: src/Backend/Services/Users/Dockerfile
          - service: polls
            context: .
            dockerfile: src/Backend/Services/Polls/Dockerfile
          - service: feedback
            context: .
            dockerfile: src/Backend/Services/Feedback/Dockerfile
          - service: gateway
            context: .
            dockerfile: src/Backend/Gateway/Dockerfile
          - service: frontend
            context: src/frontend
            dockerfile: src/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/subochartem/citypulse-${{ matrix.service }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
