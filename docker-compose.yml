services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: polls_minio
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    container_name: polls_minio_init
    depends_on:
      - minio
    restart: on-failure
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@minio:9000
    command: mb --ignore-existing local/polls-images

  rabbitmq:
    image: rabbitmq:3-management
    container_name: citypulse_rabbitmq
    env_file:
      - .env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mongodb:
    image: mongo:8
    container_name: citypulse_mongodb
    env_file:
      - .env
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  users-db:
    image: postgres:18
    container_name: citypulse_users_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: CityPulse
    ports:
      - "5432:5432"
    volumes:
      - users_db_data:/var/lib/postgresql

  polls-db:
    image: postgres:18
    container_name: citypulse_polls_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: CityPulse_polls
    ports:
      - "5433:5432"
    volumes:
      - polls_db_data:/var/lib/postgresql

volumes:
  minio_data:
  rabbitmq_data:
  mongodb_data:
  users_db_data:
  polls_db_data:
    
